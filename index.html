<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Battle City 3D</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<!-- ================= LOBBY ================= -->

<div id="lobby">

    <div class="lobby-background"></div>

    <div class="lobby-content">

        <div class="game-logo">
            <span>BATTLE</span>
            <strong>CITY</strong>
            <small>3D</small>
        </div>

        <p class="subtitle">
            BATALHE. SOBREVIVA. VENÇA.
        </p>

        <div class="player-card">

            <div class="avatar-preview">
                <div class="avatar-head"></div>
                <div class="avatar-body"></div>
            </div>

            <div>
                <h2>JOGADOR</h2>
                <p>Nível 1</p>
            </div>

        </div>

        <button id="playBtn" class="main-button">
            JOGAR
        </button>

        <button id="settingsBtn" class="secondary-button">
            ⚙ CONFIGURAÇÕES
        </button>

        <p class="version">BATTLE CITY 3D • WEB EDITION</p>

    </div>
</div>


<!-- ================= CONFIGURAÇÕES ================= -->

<div id="settingsPanel" class="modal hidden">

    <div class="modal-box">

        <button id="closeSettings" class="close">×</button>

        <h2>CONFIGURAÇÕES</h2>

        <label>
            Qualidade gráfica
            <select id="quality">
                <option value="low">Baixa</option>
                <option value="medium" selected>Média</option>
                <option value="high">Alta</option>
            </select>
        </label>

        <label>
            Sensibilidade
            <input id="sensitivity"
                   type="range"
                   min="0.3"
                   max="2"
                   step="0.1"
                   value="1">
        </label>

        <label class="switch-line">
            Mostrar minimapa
            <input id="mapToggle" type="checkbox" checked>
        </label>

        <label class="switch-line">
            Mostrar mira
            <input id="crossToggle" type="checkbox" checked>
        </label>

        <button id="saveSettings" class="main-button">
            SALVAR
        </button>

    </div>

</div>


<!-- ================= JOGO ================= -->

<div id="game" class="hidden">

    <canvas id="gameCanvas"></canvas>


    <!-- HUD SUPERIOR -->

    <div id="topHud">

        <div class="status-box">

            <div class="player-icon">
                ●
            </div>

            <div class="bars">

                <div class="health-bar">
                    <span id="health"></span>
                </div>

                <div class="shield-bar">
                    <span id="shield"></span>
                </div>

            </div>

        </div>


        <div class="match-info">

            <div>
                👥 <span id="players">10</span>
            </div>

            <div>
                ☠ <span id="kills">0</span>
            </div>

        </div>


        <div class="zone-info">

            <div>⭕ ZONA</div>

            <strong id="zoneTimer">
                60
            </strong>

        </div>

    </div>


    <!-- MINIMAPA -->

    <div id="miniMap">

        <canvas id="mapCanvas"
                width="180"
                height="180"></canvas>

    </div>


    <!-- MIRA -->

    <div id="crosshair">

        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- HIT MARKER -->

    <div id="hitMarker">
        ×
    </div>


    <!-- MENSAGEM -->

    <div id="message"></div>


    <!-- ARMA -->

    <div id="weaponHud">

        <div class="weapon-name"
             id="weaponName">
            PISTOLA
        </div>

        <div class="ammo">

            <strong id="ammo">
                12
            </strong>

            <span id="reserve">
                / 48
            </span>

        </div>

        <div class="weapon-actions">

            <button id="reloadBtn">
                ↻
            </button>

            <button id="weaponBtn">
                🔫
            </button>

        </div>

    </div>


    <!-- CONTROLES DESKTOP -->

    <div id="desktopHelp">

        <span>WASD</span> mover
        <span>SHIFT</span> correr
        <span>ESPAÇO</span> pular
        <span>R</span> recarregar
        <span>1-5</span> armas

    </div>


    <!-- CONTROLES MOBILE -->

    <div id="mobileControls">

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <button id="aimButton"
                class="mobile-button aim">
            🎯
        </button>

        <button id="fireButton"
                class="mobile-button fire">
            🔥
        </button>

        <button id="jumpButton"
                class="mobile-button jump">
            ↑
        </button>

        <button id="runButton"
                class="mobile-button run">
            🏃
        </button>

        <button id="reloadMobile"
                class="mobile-button reload">
            ↻
        </button>

        <button id="switchMobile"
                class="mobile-button switch">
            🔫
        </button>

    </div>


    <!-- PAUSA -->

    <div id="pauseScreen"
         class="overlay hidden">

        <div class="pause-box">

            <h1>PAUSADO</h1>

            <button id="continueBtn"
                    class="main-button">
                CONTINUAR
            </button>

            <button id="exitBtn"
                    class="secondary-button">
                SAIR DO JOGO
            </button>

        </div>

    </div>


    <!-- FINAL -->

    <div id="endScreen"
         class="overlay hidden">

        <div class="end-box">

            <div id="endIcon">🏆</div>

            <h1 id="endTitle">
                VITÓRIA!
            </h1>

            <p id="endText">
                Você foi o último sobrevivente.
            </p>

            <div class="results">

                <div>
                    <strong id="finalKills">0</strong>
                    <span>ELIMINAÇÕES</span>
                </div>

                <div>
                    <strong id="finalTime">0:00</strong>
                    <span>TEMPO</span>
                </div>

            </div>

            <button id="restartBtn"
                    class="main-button">
                JOGAR NOVAMENTE
            </button>

            <button id="backLobbyBtn"
                    class="secondary-button">
                VOLTAR AO LOBBY
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
